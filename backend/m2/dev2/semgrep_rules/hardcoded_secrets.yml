rules:
  - id: hardcoded-database-url
    patterns:
      - pattern: $VAR = "postgresql://$..."
    message: "하드코딩된 DB 접속 URL 감지: 자격증명이 코드에 노출됩니다. 환경변수로 이동하세요."
    languages: [python]
    severity: ERROR

  - id: hardcoded-api-key
    patterns:
      - pattern: $VAR = "$KEY"
    pattern-where-python: "re.match(r'(?i)(api[_-]?key|secret|token|password)', str(vars['$VAR'])) and len(str(vars['$KEY'])) > 8"
    message: "하드코딩된 시크릿 키 감지: 환경변수 또는 시크릿 매니저를 사용하세요."
    languages: [python]
    severity: ERROR

  - id: hardcoded-connection-string
    pattern: $VAR = "...$USER:$PASS@..."
    message: "하드코딩된 접속 문자열에 자격증명 포함: 환경변수로 이동하세요."
    languages: [python]
    severity: ERROR
