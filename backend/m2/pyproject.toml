[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "m2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "structlog>=24.2.0",
    # mini-orchestrator가 m4 /evaluate 호출·PR diff fetch에 사용 (런타임 필수)
    "httpx>=0.27.0",
    "shared",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
]
# 실제 분석 도구 — 미설치 시 analyzer가 graceful skip 한다(빈 결과).
analysis = [
    "pylint>=3.2.0",
    "radon>=6.0.0",
    "bandit>=1.7.9",
    "semgrep>=1.79.0; platform_system != 'Windows'",
]

[tool.uv.sources]
shared = { path = "../_shared", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
