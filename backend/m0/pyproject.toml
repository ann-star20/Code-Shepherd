[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "m0"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "structlog>=24.2.0",
    "shared",
    # LangGraph / LangChain
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-google-genai>=1.0.0",
    # LLM — Gemini
    "google-generativeai>=0.7.0",
    # 문서 파싱
    "pymupdf>=1.24.0",
    "unstructured[pdf,docx,pptx]>=0.14.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    # 임베딩 / pgVector
    "pgvector>=0.3.0",
    "httpx>=0.27.0",            # Ollama API 호출
    "openai>=1.30.0",           # 대용량 문서 폴백
    # Storage
    "aiofiles>=24.1.0",
    "google-cloud-storage>=2.17.0",
    # Neo4j
    "neo4j>=5.20.0",
    # Upstage
    "requests>=2.32.0",
    # 텍스트 처리
    "tiktoken>=0.7.0",
    "markdown-it-py>=3.0.0",
    # 파일 업로드
    "python-multipart>=0.0.9",
    # Retry / HTML 파싱
    "tenacity>=8.2.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    # SQL 검증 (chat_api _validate_sql_v2)
    "sqlglot>=23.0.0",
    "playwright>=1.60.0",
    "marker-pdf>=1.10.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
    "pytest-mock>=3.14.0",
]

[tool.uv.sources]
shared = { path = "../_shared", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
