[alembic]
# script_location은 alembic/ 디렉토리
script_location = alembic

# DB URL은 env.py에서 get_settings().database_url로 동적 설정
# 아래 값은 env.py가 override 하므로 placeholder만 기재
sqlalchemy.url = postgresql+asyncpg://placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
