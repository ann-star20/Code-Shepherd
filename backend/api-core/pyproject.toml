[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-core"
version = "0.1.0"
description = "code-shepherd API Core — 인증, 사용자, 팀 관리"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "PyJWT>=2.8.0",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    "structlog>=24.2.0",
    "shared",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[tool.uv.sources]
shared = { path = "../_shared", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
