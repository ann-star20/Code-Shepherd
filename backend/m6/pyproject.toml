[project]
name = "m6-knowledge-graph"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.2.0",
    "neo4j>=5.20.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "shared",
]

[tool.uv.sources]
shared = { path = "/app/_shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
