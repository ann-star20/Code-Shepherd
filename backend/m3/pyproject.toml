[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "m3"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "structlog>=24.2.0",
    "shared",
    "psycopg2-binary>=2.9",
    "google-genai>=1.0",
    "langsmith>=0.1",
    "sentence-transformers>=2.2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
]
eval = [
    "langchain-google-genai>=2.0",
    "ragas>=0.4.3,<0.5",
    "rapidfuzz>=3.0",
]

[tool.uv.sources]
shared = { path = "../_shared", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --ignore=tests/fixtures"

[tool.hatch.build.targets.wheel]
packages = ["app"]
