<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1040" viewBox="0 0 1180 1040"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#64809d"/></marker></defs><rect width="1180" height="1040" fill="#f4f7fc"/><g font-family="Malgun Gothic, sans-serif"><text x="60" y="55" font-size="28" font-weight="700" fill="#173253">M6 · 시드 기준과 지식 품질 게이트</text><rect x="60" y="100" width="460" height="96" rx="14" fill="white" stroke="#a8bdd8"/><text x="82" y="136" font-size="22" font-weight="700" fill="#173253">시드 JSON</text><text x="82" y="170" font-size="18" fill="#52647c">표준 참조 · 보안/성능 기준</text><rect x="650" y="100" width="460" height="96" rx="14" fill="white" stroke="#a8bdd8"/><text x="672" y="136" font-size="22" font-weight="700" fill="#173253">LLM 추출 후보</text><text x="672" y="170" font-size="18" fill="#52647c">JSON 파싱 · 도메인 정규화</text><rect x="650" y="240" width="460" height="96" rx="14" fill="white" stroke="#a8bdd8"/><text x="672" y="276" font-size="22" font-weight="700" fill="#173253">Pydantic 검증</text><text x="672" y="310" font-size="18" fill="#52647c">형식 · 개념 유형 · 명시 규칙</text><rect x="650" y="380" width="460" height="96" rx="14" fill="white" stroke="#a8bdd8"/><text x="672" y="416" font-size="22" font-weight="700" fill="#173253">Resolver → DRAFT</text><text x="672" y="450" font-size="18" fill="#52647c">동일·유사 개념 비교</text><rect x="650" y="520" width="460" height="96" rx="14" fill="white" stroke="#a8bdd8"/><text x="672" y="556" font-size="22" font-weight="700" fill="#173253">HITL 승인 + commit</text><text x="672" y="590" font-size="18" fill="#52647c">사람의 의미 검토</text><rect x="650" y="660" width="460" height="96" rx="14" fill="white" stroke="#a8bdd8"/><text x="672" y="696" font-size="22" font-weight="700" fill="#173253">GraphWriter 재검증</text><text x="672" y="730" font-size="18" fill="#52647c">승인 데이터 모델 재검사</text><rect x="350" y="820" width="460" height="96" rx="14" fill="white" stroke="#a8bdd8"/><text x=