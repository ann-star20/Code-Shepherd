<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1650" viewBox="0 0 1680 1650"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#737c8a"/></marker></defs><rect width="1680" height="1650" fill="#ffffff"/><g font-family="Malgun Gothic,Segoe UI,sans-serif" fill="#242b36"><text x="60" y="65" font-size="34" font-weight="700">CodeShepherd · 전체 프로젝트 아키텍처</text><text x="60" y="102" font-size="20" fill="#626b77">조직 문서와 코드 변경을 지식 관리 · 검수 · 개발자 학습으로 연결</text><rect x="60" y="140" width="1560" height="100" rx="16" fill="#f6f7f9" stroke="#c7ccd3" stroke-width="1.5"/><text x="84" y="180" font-size="23" font-weight="700" fill="#303743">사용자 · Frontend (React / Vite / TypeScript)</text><text x="84" y="218" font-size="19" fill="#59626f">문서 등록 · PR 분석 결과 확인 · 커리큘럼 요청 · 지식 검수 · 그래프 탐색 · 영상 추천</text><text x="60" y="305" font-size="24" font-weight="700">공통 서비스와 팀 모듈</text><text x="800" y="305" font-size="24" font-weight="700">지식 그래프 구축과 활용</text><rect x="60" y="345" width="650" height="110" rx="16" fill="#f6f7f9" stroke="#c7ccd3" stroke-width="1.5"/><text x="84" y="385" font-size="23" font-weight="700" fill="#303743">api-core · 인증과 사용자 관리</text><text x="84" y="423" font-size="19" fill="#59626f">GitHub OAuth · JWT · 사용자 / 팀</text><rect x="60" y="520" width="200" height="115" rx="16" fill="#f6f7f9" stroke="#c7ccd3" stroke-width="1.5"/><text x="84" y="560" font-size="23" font-weight="700" fill="#303743">GitHub</text><text x="84" y="598" font-size="19" fill="#59626f">PR Webhook</text><rect x="310" y="520" width="400" height="115" rx="16" fill="#f6f7f9" stroke="#c7ccd3" stroke-width="1.5"/><text x="334" y="560" font-size="23" font-weight="700" fill="#303743">M1 · PR 감지</text><text x="334" y="598" font-size="19" fill="#59626f">웹훅 검증 · diff 수집 · 호출 조정</text><path d="M260 577 H310" fill="none" stroke="#737c8a" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="715" width="300" height="145" rx="16" fill="#f6f7f9" stroke="#c7ccd3" stroke-width="1.5"/><text x="84" y="755" font-size="23" font-weight="700" fill="#303743">M2 · 보안 스캔</text><text x="84" y="793" font-size="19" fill="#59626f">정적 분석</text><text x="84" y="825" font-size="19" fill="#59626f">보안 취약점 검사</text><rect x="410" y="715" width="300" height="145" rx="16" fill="#f6f7f9" stroke="#c7ccd3" stroke-width="1.5"/><text x="434" y="755" font-size="23" font-weight="700" fill="#303743">M3 · 검증·리뷰</text><text x="434" y="793" font-size="19" fill="#59626f">테스트 · 성능 분석</text><text x="434" y="825" font-size="19" fill="#59626f">리뷰 결과 집계</text><path d="M510 635 V675 H210 V715" fill="none" stroke="#737c8a" stroke-width="2" marker-end="url(#arrow)"/><path d="M510 675 H560 V715" fill="none" stroke="#737c8a" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="940" width="650" height="145" rx="16" fill="#f6f7f9" stroke="#c7ccd3" stroke-width="1.5"/><text x="84" y="980" font-size="23" font-weight="700" fill="#303743">M0 · KMS 문서 관리</text><text x="84" y="1018" font-size="19" fill="#59626f">문서 처리 · 청킹 · HITL · 검색</text><text x="84" y="1050" font-size="19" fill="#59626f">KMS 저장소 / 별도 Neo4j 인스턴스</text><rect x="60" y="1140" width="650" height="145" rx="16" fill="#f6f7f9" stroke="#c7ccd3" stroke-width="1.5"/><text x="84" y="1180" font-size="23" font-weight="700" fill="#303743">M4 · 학습 커리큘럼</text><text x="84" y="1218" font-size="19" fill="#59626f">사용자 학습 요청에 따른 커리큘럼·문서 생성</text><text x="84" y="1250" font-size="19" fill="#59626f">M1의 현재 PR 처리 체인과 별도 요청 경로</text><rect x="800" y="345" width="780" height="300" rx="16" fill="#edf4ff" stroke="#2563eb" stroke-width="2.5"/><text x="824" y="385" font-size="23" font-weight="700" fill="#1749a0">M6 · 온톨로지 기반 지식 그래프</text><text x="824" y="423" font-size="19" fill="#34547f">외부 문서 → 수집·청킹 → LLM 추출·검증</text><text x="824" y="455" font-size="19" fill="#34547f">Hybrid Resolver → DRAFT → HITL 승인·commit</text><text x="824" y="487" font-size="19" fill="#34547f">Celery Worker → 반영 전 재검증 → 그래프 MERGE</text><text x="824" y="519" font-size="19" fill="#34547f">시드 기준 · 4계층 모델 · 자연키·중복 제어</text><rect x="1436" y="363" width="120" height="34" rx="17" fill="#2563eb"/><text x="1496" y="386" text-anchor="middle" font-size="19" font-weight="700" fill="white">My Role</text><rect x="800" y="715" width="330" height="110" rx="16" fill="#f6f7f9" stroke="#c7ccd3" stroke-width="1.5"/><text x="824" y="755" font-size="23" font-weight="700" fill="#303743">PostgreSQL / pgvector</text><text x="824" y="793" font-size="19" fill="#59626f">기준 개념 · 벡터 · 검수 상태</text><rect x="1180" y="715" width="400" height="110" rx="16" fill="#f6f7f9" stroke="#c7ccd3" stroke-width="1.5"/><text x="1204" y="755" font-size="23" font-weight="700" fill="#303743">Redis / Celery</text><text x="1204" y="793" font-size="19" fill="#59626f">작업 큐 · 진행 이벤트 / SSE</text><path d="M965 645 V715" fill="none" stroke="#737c8a" stroke-width="2" marker-end="url(#arrow)"/><path d="M1380 645 V715" fill="none" stroke="#737c8a" stroke-width="2" marker-end="url(#arrow)"/><rect x="800" y="900" width="780" height="125" rx="16" fill="#f6f7f9" stroke="#c7ccd3" stroke-width="1.5"/><text x="824" y="940" font-size="23" font-weight="700" fill="#303743">공유 Neo4j · neo4j_m6</text><text x="824" y="978" font-size="19" fill="#59626f">M6: 온톨로지 지식 / M5: 검색 풀 · 영상 · 갱신 시각</text><text x="824" y="1010" font-size="19" fill="#59626f">Compose 별도 인스턴스 · Aura 연결 설정 가능</text><path d="M1580 580 H1605 V960 H1580" fill="none" stroke="#737c8a" stroke-width="2" marker-end="url(#arrow)"/><text x="1400" y="875" font-size="17" fill="#626b77">M6 그래프 반영</text><rect x="800" y="1100" width="780" height="230" rx="16" fill="#edf4ff" stroke="#2563eb" stroke-width="2.5"/><text x="824" y="1140" font-size="23" font-weight="700" fill="#1749a0">M5 · 그래프 기반 YouTube 추천</text><text x="824" y="1178" font-size="19" fill="#34547f">추천 API: 선택 개념·기법·언어·프레임워크 → DB 조회</text><text x="824" y="1210" font-size="19" fill="#34547f">주기 수집기: 갱신 대상 선정 → 호출 제한 검사 → 영상 저장</text><text x="824" y="1242" font-size="19" fill="#34547f">추천 요청 경로와 외부 API 수집 경로 분리</text><rect x="1436" y="1118" width="120" height="34" rx="17" fill="#2563eb"/><text x="1496" y="1141" text-anchor="middle" font-size="19" font-weight="700" fill="white">My Role</text><path d="M1000 1100 V1025" fill="none" stroke="#737c8a" stroke-width="2" marker-end="url(#arrow)"/><text x="800" y="1070" font-size="17" fill="#626b77">그래프·저장 영상 조회</text><path d="M1480 1100 V1025" fill="none" stroke="#737c8a" stroke-width="2" marker-end="url(#arrow)"/><text x="1340" y="1070" font-size="17" fill="#626b77">수집 결과 저장·갱신</text><rect x="800" y="1430" width="780" height="100" rx="16" fill="#f6f7f9" stroke="#c7ccd3" stroke-width="1.5"/><text x="824" y="1470" font-size="23" font-weight="700" fill="#303743">YouTube Data API v3</text><text x="824" y="1508" font-size="19" fill="#59626f">수집기에서 search.list / videos.list 호출</text><path d="M1400 1330 V1430" fill="none" stroke="#737c8a" stroke-width="2" marker-end="url(#arrow)"/><text x="1130" y="1388" font-size="17" fill="#626b77">주기 수집기만 외부 호출</text><path d="M385 240 V345" fill="none" stroke="#737c8a" stroke-width="2" marker-end="url(#arrow)"/><text x="405" y="285" font-size="17" fill="#626b77">인증·팀 관리</text><path d="M35 240 V1200 H60" fill="none" stroke="#737c8a" stroke-width="2" marker-end="url(#arrow)"/><text x="60" y="1340" font-size="18" fill="#626b77">Frontend는 기능별 API를 호출합니다.</text><text x="60" y="1372" font-size="18" fill="#626b77">모듈 박스의 순서는 전체 시스템의 실행 순서를 뜻하지 않습니다.</text><text x="60" y="1455" font-size="19" fill="#626b77">범위: backend M0~M6 + 공통 UI·인증</text><text x="60" y="1490" font-size="19" fill="#626b77">근거: 실행 코드와 Docker Compose 구성</text><line x1="60" y1="1560" x2="1620" y2="1560" stroke="#d9dde3"/><text x="60" y="1605" font-size="19" fill="#626b77">강조 범위: M5·M6 설계·구현 | 두 모듈은 공유 DB로 연결되며 직접 모듈 호출은 없습니다.</text></g></svg>