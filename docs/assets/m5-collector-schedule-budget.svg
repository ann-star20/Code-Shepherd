<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1120" viewBox="0 0 1280 1120"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs><style>text{font-family:Malgun Gothic,Segoe UI,sans-serif;fill:#172b4d}.title{font-size:20px;font-weight:700}.body{font-size:17px}.head{font-size:27px;font-weight:700}</style><rect width="1280" height="1120" fill="#f8fafc"/><text x="40" y="48" class="head">M5 Collector | 실행 주기 · 처리 흐름 · API 호출 제한</text><rect x="40" y="85" width="1200" height="105" rx="12" fill="#eaf2ff" stroke="#cbd5e1"/><text x="58" y="115" class="title">실행 방식: watch 모드 · 고정 지연 24시간</text><text x="58" y="144" class="body">프로세스 시작 즉시 실행 → 수집 완료 → 24시간 대기 → 다음 실행</text><text x="58" y="168" class="body">작업 완료 후 24시간 대기 / 재시작 시 즉시 실행 / 운영 환경에서 활성화</text><rect x="40" y="235" width="360" height="120" rx="12" fill="#eaf2ff" stroke="#cbd5e1"/><text x="58" y="265" class="title">① 분산 락 획득 · 데이터 정리</text><text x="58" y="294" class="body">Neo4j 락 TTL 120초 / 동시 실행 제어</text><text x="58" y="318" class="body">28일 풀·영상 / 35일 예산 정리</text><rect x="460" y="235" width="360" height="120" rx="12" fill="#eaf2ff" stroke="#cbd5e1"/><text x="478" y="265" class="title">② 전체 맥락 → 갱신 대상 선정</text><text x="478" y="294" class="body">미수집 또는 마지막 수집 후 7일 경과</text><text x="478" y="318" class="body">중복 검색어 제거 / 오래된 순</text><path d="M400 295 L460 295" stroke="#64748b" stroke-width="2" marker-end="url(#a)" fill="none"/><rect x="880" y="235" width="360" height="120" rx="12" fill="#eaf2ff" stroke="#cbd5e1"/><text x="898" y="265" class="title">③ 기존 영상 상태 확인</text><text x="898" y="294" class="body">24시간 경과 → videos.list</text><text x="898" y="318" class="body">최대 50개 × 10배치 / 검색과 별도</text><path d="M820 295 L880 295" stroke="#64748b" stroke-width="2" marker-end="url(#a)" fill="none"/><rect x="880" y="410" width="360" height="145" rx="12" fill="#fff3db" stroke="#cbd5e1"/><text x="898" y="440" class="title">④ 일일 호출 제한 확인</text><text x="898" y="469" class="body">YouTubeSearchBudget(day, calls)</text><text x="898" y="493" class="body">LA 날짜 calls가 80 미만이면 +1</text><text x="898" y="517" class="body">실행당 최대 80회 / 락 유효성 검사</text><path d="M1060 355 L1060 410" stroke="#64748b" stroke-width="2" marker-end="url(#a)" fill="none"/><rect x="460" y="410" width="360" height="145" rx="12" fill="#eaf2ff" stroke="#cbd5e1"/><text x="478" y="440" class="title">⑤ 카운터 갱신 후 검색</text><text x="478" y="469" class="body">search.list → 최대 50개 요청</text><text x="478" y="493" class="body">호출 실패 시에도 카운터 유지</text><text x="478" y="517" class="body">상한 도달 시 추가 검색 중단</text><path d="M880 482 L820 482" stroke="#64748b" stroke-width="2" marker-end="url(#a)" fill="none"/><rect x="40" y="410" width="360" height="145" rx="12" fill="#eaf2ff" stroke="#cbd5e1"/><text x="58" y="440" class="title">⑥ 새 후보 스냅샷 반영</text><text x="58" y="469" class="body">Neo4j 단일 트랜잭션으로 교체</text><text x="58" y="493" class="body">성공 수집 시각·만료 시각 갱신</text><text x="58" y="517" class="body">실패한 풀은 기존 유효 데이터 유지</text><path d="M460 482 L400 482" stroke="#64748b" stroke-width="2" marker-end="url(#a)" fill="none"/><rect x="40" y="615" width="780" height="115" rx="12" fill="#eaf2ff" stroke="#cbd5e1"/><text x="58" y="645" class="title">⑦ 분산 락 해제 · 결과 로그 출력 · 완료 후 24시간 대기</text><text x="58" y="674" class="body">미처리 검색 작업을 큐에 영구 적재하는 구조는 아님</text><text x="58" y="698" class="body">다음 실행에서 검색 대상과 DB 시각을 다시 비교해 재선정</text><path d="M220 555 L220 615" stroke="#64748b" stroke-width="2" marker-end="url(#a)" fill="none"/><rect x="880" y="615" width="360" height="115" rx="12" fill="#e9f7f0" stroke="#cbd5e1"/><text x="898" y="645" class="title">사용자 추천은 독립 경로</text><text x="898" y="674" class="body">요청 → Neo4j 후보 조회 → 응답</text><text x="898" y="698" class="body">외부 검색·호출 카운터 변경 없음</text><rect x="40" y="790" width="570" height="125" rx="12" fill="#fff3db" stroke="#cbd5e1"/><text x="58" y="820" class="title">DB 트랜잭션 기반 호출 횟수 관리</text><text x="58" y="849" class="body">검색 요청 전 calls를 1 증가</text><text x="58" y="873" class="body">YouTubeSearchBudget는 Neo4j에 저장</text><text x="58" y="897" class="body">프로세스 재시작 후에도 같은 날 기록 재사용</text><rect x="670" y="790" width="570" height="125" rx="12" fill="#eaf2ff" stroke="#cbd5e1"/><text x="688" y="820" class="title">집계 기준 시간대와 일자 전환</text><text x="688" y="849" class="body">다음 검색 때 새 날짜의 예산 노드를 생성</text><text x="688" y="873" class="body">새 노드 calls=0 → 첫 검색 전 1로 증가</text><text x="688" y="897" class="body">이전 기록은 35일 후 수집기 실행 시 정리</text><rect x="40" y="970" width="1200" height="105" rx="12" fill="#e9f7f0" stroke="#cbd5e1"/><text x="58" y="1000" class="title">서로 다른 세 가지 시계</text><text x="58" y="1029" class="body">24시간: 완료 후 다음 실행까지 대기 / 7일: 검색 풀 재검색 대상 판단 / LA 날짜: 일일 호출 횟수 집계</text><text x="58" y="1053" class="body">기한 도래가 즉시 실행을 뜻하지 않으며, 다음 실행과 남은 예산에 따라 실제 갱신 시점이 결정됨</text></svg>