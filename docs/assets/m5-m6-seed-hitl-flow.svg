<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1060" viewBox="0 0 1280 1060"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><style>text{font-family:Segoe UI,Malgun Gothic,sans-serif;fill:#172b4d}.title{font-size:21px;font-weight:700}.body{font-size:17px}.label{font-size:25px;font-weight:700}</style><rect width="1280" height="1060" fill="#f8fafc"/><text x="40" y="50" class="label">CodeShepherd | Seed → Human Review → Knowledge → Learning</text><text x="40" y="90" class="body">M6 지식의 구조·품질 관리 / M5 영상 수집·갱신·추천 제공</text><rect x="40" y="125" width="355" height="135" rx="14" fill="#eaf2ff" stroke="#cbd5e1"/><text x="60" y="157" class="title">01 초기 준비 · 직접 적재</text><text x="60" y="187" class="body">스키마·고유 제약 → 검토된 JSON</text><text x="60" y="212" class="body">Neo4j 시드 / PostgreSQL 기준 개념</text><text x="60" y="237" class="body">외부 문서 HITL과 별도 경로</text><rect x="465" y="125" width="350" height="135" rx="14" fill="#eaf2ff" stroke="#cbd5e1"/><text x="485" y="157" class="title">M6 · 4계층 지식 그래프</text><text x="485" y="187" class="body">Domain → Concept</text><text x="485" y="212" class="body">Mechanism / RootCause / Component</text><text x="485" y="237" class="body">Mechanism → CodeExample</text><path d="M 395 193 L 465 193" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="320" width="355" height="115" rx="14" fill="#eaf2ff" stroke="#cbd5e1"/><text x="60" y="352" class="title">02 외부 문서 등록</text><text x="60" y="382" class="body">Prescan: 해시·ETag 중복 확인</text><text x="60" y="407" class="body">언어·프레임워크 인식</text><rect x="465" y="320" width="350" height="115" rx="14" fill="#fff3db" stroke="#cbd5e1"/><text x="485" y="352" class="title">HITL ① 메타데이터 보완</text><text x="485" y="382" class="body">자동 인식하지 못한 경우 입력</text><text x="485" y="407" class="body">보완 또는 skip 후 처리 재개</text><path d="M 395 377 L 465 377" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="465" y="485" width="350" height="115" rx="14" fill="#eaf2ff" stroke="#cbd5e1"/><text x="485" y="517" class="title">Crawl → Extract · Resolver</text><text x="485" y="547" class="body">구조화 추출·기존 개념과 비교</text><text x="485" y="572" class="body">PostgreSQL staging: DRAFT</text><path d="M 640 435 L 640 485" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="885" y="485" width="355" height="140" rx="14" fill="#fff3db" stroke="#cbd5e1"/><text x="905" y="517" class="title">HITL ② 후보 검수</text><text x="905" y="547" class="body">개념·관계·코드·병합 판단 확인</text><text x="905" y="572" class="body">승인: APPROVED / 반려: REJECTED</text><text x="905" y="597" class="body">승인과 실제 저장 요청을 분리</text><path d="M 815 542 L 885 542" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="885" y="320" width="355" height="115" rx="14" fill="#eaf2ff" stroke="#cbd5e1"/><text x="905" y="352" class="title">commit 요청 → GraphWriter</text><text x="905" y="382" class="body">APPROVED만 처리·행 잠금</text><text x="905" y="407" class="body">Neo4j 반영 후 COMMITTED</text><path d="M 1062 485 L 1062 435" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M 1062 320 L 1062 193" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M 1062 193 L 815 193" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="715" width="355" height="140" rx="14" fill="#eaf2ff" stroke="#cbd5e1"/><text x="60" y="747" class="title">03 M5 주기 실행 수집기</text><text x="60" y="777" class="body">전체 개념·코드 맥락 → 검색어</text><text x="60" y="802" class="body">신규·갱신 대상 우선 / 예산 제한</text><text x="60" y="827" class="body">스케줄러 또는 watch 모드 활성화</text><rect x="465" y="715" width="350" height="140" rx="14" fill="#eaf2ff" stroke="#cbd5e1"/><text x="485" y="747" class="title">YouTube → Neo4j 영상 풀</text><text x="485" y="777" class="body">검색 최대 50개 → 원자적 교체</text><text x="485" y="802" class="body">7일 재검색 / 24시간 메타 검증</text><text x="485" y="827" class="body">28일 보존 / 시간 속성 기록</text><path d="M 395 785 L 465 785" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="885" y="715" width="355" height="140" rx="14" fill="#eaf2ff" stroke="#cbd5e1"/><text x="905" y="747" class="title">사용자 선택 → 추천 API</text><text x="905" y="777" class="body">Concept·기법·언어·프레임워크</text><text x="905" y="802" class="body">저장 후보 조회 → 중복 제거</text><text x="905" y="827" class="body">최대 5개 반환 / 외부 검색 없음</text><path d="M 815 785 L 885 785" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M465 230 L430 230 L430 665 L217 665 L217 715" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="915" width="1200" height="105" rx="14" fill="#e9f7f0" stroke="#cbd5e1"/><text x="60" y="947" class="title">왜 HITL인가?</text><text x="60" y="977" class="body">문제와 방어 기법 혼동·잘못된 병합·구현 맥락 오분류가 영구 지식과 추천으로 전파되는 것을 줄입니다.</text><text x="60" y="1002" class="body">초기 시드는 기준 데이터로 직접 적재하며, 외부 문서에서 추출한 후보에 검수 게이트를 둡니다.</text></svg>