# ============================================================
# Code-Shepherd — 전체 스택 로컬 실행
#
# 시작:  docker compose up -d
# 중지:  docker compose down
# 로그:  docker compose logs -f api
# 초기화: docker compose down -v   (볼륨 포함 전체 삭제)
#
# 필수 사전 작업:
#   cp .env.example .env
#   (필요한 API 키들을 .env에서 설정)
#
# GCS 인증 (Storage):
#   gcloud auth application-default login
#   → ~/.config/gcloud/application_default_credentials.json 생성됨
# ============================================================

services:

  # ----------------------------------------------------------
  # Neo4j 5 (그래프 DB — Module 5 엔티티/관계)
  # ----------------------------------------------------------
  neo4j:
    image: neo4j:5
    container_name: kms-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------------
  # Ollama (로컬 LLM + 임베딩 — bge-m3 1024차원)
  # GPU가 없으면 CPU 모드로 실행 (느리지만 동작함)
  # M1/M2/M3 Mac에서는 host.docker.internal로 로컬 Ollama 사용 권장
  # ----------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: kms-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

  # ----------------------------------------------------------
  # KMS API (FastAPI + LangGraph 파이프라인)
  # PostgreSQL: .env의 POSTGRES_URL = Google Cloud SQL 사용
  # Storage: GCS (Application Default Credentials 인증)
  # ----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: kms-api:latest
    container_name: kms-api
    restart: unless-stopped
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      OLLAMA_BASE_URL: http://ollama:11434
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      STORAGE_BACKEND: gcs
      GCS_BUCKET: tasklink-kms-storage-dev   # 팀 공유 버킷 (버킷명은 비밀 아님)
      GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
    ports:
      - "8001:8001"
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - apidata:/app/data
      - ${APPDATA}/gcloud:/root/.config/gcloud:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Frontend (Vite 개발 서버)
  # 프로덕션 배포 시 target: build + nginx 이미지로 교체
  # ----------------------------------------------------------
  frontend:
    image: node:20-alpine
    container_name: kms-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: ""           # 브라우저 기준 비워두면 현재 호스트(localhost:5173) 사용
      API_TARGET: http://api:8001  # Vite 프록시가 api 컨테이너로 요청 전달
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_nm:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  neo4jdata:
  ollamadata:
  apidata:
  frontend_nm:
