services:

  # ── 인프라 ────────────────────────────────────────────────────────────────

  neo4j:
    image: neo4j:5.18-community
    hostname: neo4j
    environment:
      NEO4J_AUTH: neo4j/pass1234!
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
    ports:
      - "7475:7474"   # HTTP Browser
      - "7688:7687"   # Bolt
    volumes:
      - ${USERPROFILE}/neo4j:/data
      - ${USERPROFILE}/neo4j/logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - ${USERPROFILE}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── 백엔드 ────────────────────────────────────────────────────────────────

  backend:
    build: ./backend
    image: code-shepherd-base:latest # ⭐ 여기에 이름을 명시해야 워커가 땡겨 쓸 수 있음!
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app                # 로컬 코드 동기화
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: pass1234!
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      APP_MODE: ${APP_MODE:-development}
      USE_REAL_LLM: ${USE_REAL_LLM:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  celery_worker:
    image: code-shepherd-base:latest # backend 빌드 이미지 재사용 (중복 빌드 제거)
    volumes:
      - ./backend:/app                # ⭐ 워커에도 볼륨을 묶어줘야 태스크 코드가 실시간 반영됨!
      - hf_cache:/root/.cache/huggingface
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: pass1234!
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      APP_MODE: ${APP_MODE:-mock}
      USE_REAL_LLM: ${USE_REAL_LLM:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=1

  # ── 프론트엔드 ────────────────────────────────────────────────────────────

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend


volumes:
  hf_cache:  