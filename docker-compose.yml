version: "3.9"

networks:
  code-shepherd:
    driver: bridge

services:
  api-core:
    build:
      context: ./backend
      dockerfile: api-core/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend/_shared:/app/_shared:ro
      - ./backend/api-core:/app/service
      - /app/service/.venv   # 호스트(윈도우) venv 가 컨테이너 리눅스 venv 를 덮지 않게 격리
    networks:
      - code-shepherd
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  m1:
    build:
      context: ./backend
      dockerfile: m1/Dockerfile
    ports:
      - "8001:8001"
    env_file: .env
    volumes:
      - ./backend/_shared:/app/_shared:ro
      - ./backend/m1:/app/service
      - /app/service/.venv   # 호스트(윈도우) venv 가 컨테이너 리눅스 venv 를 덮지 않게 격리
    networks:
      - code-shepherd
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  m0:
    build:
      context: ./backend
      dockerfile: m0/Dockerfile
    ports:
      - "8002:8002"
    env_file: .env
    volumes:
      - ./backend/_shared:/app/_shared:ro
      - ./backend/m0:/app/service
      - /app/service/.venv   # 호스트(윈도우) venv 가 컨테이너 리눅스 venv 를 덮지 않게 격리
    networks:
      - code-shepherd
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload

  m2:
    build:
      context: ./backend
      dockerfile: m2/Dockerfile
    ports:
      - "8003:8003"
    env_file: .env
    volumes:
      - ./backend/_shared:/app/_shared:ro
      - ./backend/m2:/app/service
      - /app/service/.venv   # 호스트(윈도우) venv 가 컨테이너 리눅스 venv 를 덮지 않게 격리
    networks:
      - code-shepherd
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload

  m3:
    build:
      context: ./backend
      dockerfile: m3/Dockerfile
    ports:
      - "8004:8004"
    env_file: .env
    environment:
      RAG_ENABLED: "1"   # 기본 ON — 실 분석 시 rag_context 채움. 테스트는 conftest _rag_off 로 격리.
    volumes:
      - ./backend/_shared:/app/_shared:ro
      - ./backend/m3:/app/service
      # 익명 볼륨: 호스트(윈도우) .venv 가 컨테이너 리눅스 venv 를 덮어쓰지 않게 격리.
      # (프론트의 - /app/node_modules 와 동일 패턴) 없으면 uv가 마운트된 윈도우 FS 에
      # torch 재설치를 시도하다 I/O 에러 → 크래시 루프.
      - /app/service/.venv
      # HuggingFace 캐시 볼륨: recreate 마다 BGE-M3 재다운로드 방지 (수 GB 모델).
      - hf_cache:/root/.cache/huggingface
    networks:
      - code-shepherd
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8004 --reload

  m4:
    build:
      context: ./backend
      dockerfile: m4/Dockerfile
    ports:
      - "8005:8005"
    env_file: .env
    volumes:
      - ./backend/_shared:/app/_shared:ro
      - ./backend/m4:/app/service
      - /app/service/.venv   # 호스트(윈도우) venv 가 컨테이너 리눅스 venv 를 덮지 않게 격리
    networks:
      - code-shepherd
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8005 --reload

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-codeshepherd}
    volumes:
      - neo4j_data:/data
    networks:
      - code-shepherd
    restart: unless-stopped

  m5:
    build:
      context: ./backend
      dockerfile: m5/Dockerfile
    ports:
      - "8006:8006"
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
    volumes:
      - ./backend/_shared:/app/_shared:ro
      - ./backend/m5:/app/service
      - /app/service/.venv   # 호스트(윈도우) venv 가 컨테이너 리눅스 venv 를 덮지 않게 격리
    networks:
      - code-shepherd
    depends_on:
      - neo4j
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8006 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - code-shepherd
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0

volumes:
  neo4j_data:
  hf_cache:   # BGE-M3 모델 캐시 — m3 recreate 마다 재다운로드 방지
