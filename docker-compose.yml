version: "3.9"

networks:
  code-shepherd:
    driver: bridge

services:
  api-core:
    build:
      context: ./backend
      dockerfile: api-core/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend/_shared:/app/_shared:ro
      - ./backend/api-core:/app/service
    networks:
      - code-shepherd
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  m1:
    build:
      context: ./backend
      dockerfile: m1/Dockerfile
    ports:
      - "8001:8001"
    env_file: .env
    volumes:
      - ./backend/_shared:/app/_shared:ro
      - ./backend/m1:/app/service
    networks:
      - code-shepherd
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  m0:
    build:
      context: ./backend
      dockerfile: m0/Dockerfile
    ports:
      - "8002:8002"
    env_file: .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
      GCS_KEY_PATH: /root/.config/gcloud/application_default_credentials.json
      NEO4J_URI: bolt://host.docker.internal:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    volumes:
      - ./backend/_shared:/app/_shared:ro
      - ./backend/m0:/app/service
      - ${GOOGLE_ADC_PATH}:/root/.config/gcloud/application_default_credentials.json:ro
      - ./secrets:/app/secrets:ro
    networks:
      - code-shepherd
    restart: unless-stopped
    command: /app/.venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8002

  m2:
    build:
      context: ./backend
      dockerfile: m2/Dockerfile
    ports:
      - "8003:8003"
    env_file: .env
    volumes:
      - ./backend/_shared:/app/_shared:ro
      - ./backend/m2:/app/service
    networks:
      - code-shepherd
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload

  m3:
    build:
      context: ./backend
      dockerfile: m3/Dockerfile
    ports:
      - "8004:8004"
    env_file: .env
    volumes:
      - ./backend/_shared:/app/_shared:ro
      - ./backend/m3:/app/service
    networks:
      - code-shepherd
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8004 --reload

  m4:
    build:
      context: ./backend
      dockerfile: m4/Dockerfile
    ports:
      - "8005:8005"
    env_file: .env
    volumes:
      - ./backend/_shared:/app/_shared:ro
      - ./backend/m4:/app/service
    networks:
      - code-shepherd
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8005 --reload

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-codeshepherd}
    volumes:
      - neo4j_data:/data
    networks:
      - code-shepherd
    restart: unless-stopped

  m5:
    build:
      context: ./backend
      dockerfile: m5/Dockerfile
    ports:
      - "8006:8006"
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
    volumes:
      - ./backend/_shared:/app/_shared:ro
      - ./backend/m5:/app/service
    networks:
      - code-shepherd
    depends_on:
      - neo4j
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8006 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - code-shepherd
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0

volumes:
  neo4j_data:
