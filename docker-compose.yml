version: "3.9"

networks:
  code-shepherd:
    driver: bridge

volumes:
  secrets:

services:
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "${CLOUDSQL_INSTANCE_CONNECTION_NAME}"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/sa-key.json
    volumes:
      - ./secrets:/secrets:ro
    networks:
      - code-shepherd
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5432"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-core:
    build:
      context: ./backend
      dockerfile: api-core/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DB_HOST: cloud-sql-proxy
    volumes:
      - ./backend/_shared:/app/_shared:ro
      - ./backend/api-core:/app/service
    depends_on:
      cloud-sql-proxy:
        condition: service_healthy
    networks:
      - code-shepherd
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  m1:
    build:
      context: ./backend
      dockerfile: m1/Dockerfile
    ports:
      - "8001:8001"
    env_file: .env
    volumes:
      - ./backend/_shared:/app/_shared:ro
      - ./backend/m1:/app/service
    networks:
      - code-shepherd
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  m0:
    build:
      context: ./backend
      dockerfile: m0/Dockerfile
    ports:
      - "8002:8002"
    env_file: .env
    volumes:
      - ./backend/_shared:/app/_shared:ro
      - ./backend/m0:/app/service
    networks:
      - code-shepherd
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload

  m2:
    build:
      context: ./backend
      dockerfile: m2/Dockerfile
    ports:
      - "8003:8003"
    env_file: .env
    volumes:
      - ./backend/_shared:/app/_shared:ro
      - ./backend/m2:/app/service
    networks:
      - code-shepherd
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload

  m3:
    build:
      context: ./backend
      dockerfile: m3/Dockerfile
    ports:
      - "8004:8004"
    env_file: .env
    volumes:
      - ./backend/_shared:/app/_shared:ro
      - ./backend/m3:/app/service
    networks:
      - code-shepherd
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8004 --reload

  m4:
    build:
      context: ./backend
      dockerfile: m4/Dockerfile
    ports:
      - "8005:8005"
    env_file: .env
    volumes:
      - ./backend/_shared:/app/_shared:ro
      - ./backend/m4:/app/service
    networks:
      - code-shepherd
    restart: unless-stopped
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8005 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - code-shepherd
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
